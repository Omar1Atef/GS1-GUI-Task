# Application under test
base.url=https://the-internet.herokuapp.com/

# Browser: chrome | firefox   (override with -Dbrowser=firefox)
browser=chrome

# Visible browser by default so a run can be watched.
# Override for CI or a quiet local run: -Dheadless=true
headless=false

# Synchronisation
timeout.explicit.seconds=15
timeout.pageload.seconds=30
